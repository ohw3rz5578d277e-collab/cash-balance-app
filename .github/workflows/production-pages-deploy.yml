name: Production Pages Deploy

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved main SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cash-balance-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Verify exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "${{ inputs.expected_sha }}"
          echo "EXACT_HEAD_VERIFIED=PASS"

      - name: Syntax and regression gates
        shell: bash
        run: |
          set -euo pipefail
          node --check home-dashboard.js
          node --check attendance-core.js
          node --check attendance-history.js
          node --check attendance.js
          node --check history-manager.js
          node --check bank-deposit-reconcile.js
          node --check functions/index.js
          node --check functions/_middleware.js
          node --test tests/*.test.cjs
          echo "PRODUCTION_PREFLIGHT=PASS"

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "799b203a471e51a791129a5ca97a9b2b"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.147.0 pages deploy . \
            --project-name=cash-balance-app \
            --branch=main \
            --commit-hash="${{ inputs.expected_sha }}" \
            --commit-dirty=false
