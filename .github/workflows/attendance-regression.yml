name: Attendance Regression (no production access)

on:
  pull_request:
    paths:
      - 'attendance-core.js'
      - 'attendance-history.js'
      - 'attendance.js'
      - 'functions/index.js'
      - 'functions/_middleware.js'
      - 'functions/api/records.js'
      - 'history-manager.js'
      - 'index.html'
      - 'tests/attendance-*.test.cjs'
      - '.github/workflows/attendance-regression.yml'
      - '.github/workflows/production-pages-deploy.yml'
concurrency:
  group: attendance-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  attendance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check attendance scripts
        run: |
          set -euo pipefail
          node --check attendance-core.js
          node --check attendance-history.js
          node --check attendance.js
          node --check history-manager.js
      - name: Run attendance regression tests
        run: |
          set -euo pipefail
          node --test tests/attendance-*.test.cjs
